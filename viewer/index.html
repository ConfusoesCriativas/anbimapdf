<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ANBIMA PDF Viewer</title>

  <style>
    :root {
      --page-gap: 12px;
      --background: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--background);
    }

    body {
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #viewer {
      width: 100%;
      margin: 0;
      padding: 0;
      background: var(--background);
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0 0 var(--page-gap) 0;
      padding: 0;
      background: #ffffff;
      overflow: hidden;
    }

    .page:last-child {
      margin-bottom: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    #status {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 24px;
      color: #333;
      background: #fff;
      text-align: center;
      font-size: 14px;
    }

    #status[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div id="status">Carregando PDF…</div>
  <main id="viewer" aria-label="Visualizador de PDF"></main>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.5.207/build/pdf.min.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@5.5.207/build/pdf.worker.min.mjs";

    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    const requestedQuality = Number(params.get("quality") || "1.5");
    const quality = Number.isFinite(requestedQuality)
      ? Math.min(Math.max(requestedQuality, 1), 2.5)
      : 1.5;

    const maxOutputScale = 4;
    const viewer = document.getElementById("viewer");
    const status = document.getElementById("status");

    let pdfDocument = null;
    let resizeTimer = null;
    let renderGeneration = 0;

    function showError(message) {
      status.hidden = false;
      status.textContent = message;
      viewer.innerHTML = "";
    }

    function getOutputScale() {
      const dpr = window.devicePixelRatio || 1;
      return Math.min(dpr * quality, maxOutputScale);
    }

    async function renderPage(pageNumber, generation) {
      const page = await pdfDocument.getPage(pageNumber);

      if (generation !== renderGeneration) return;

      const unscaledViewport = page.getViewport({ scale: 1 });
      const targetWidth = Math.max(document.documentElement.clientWidth, 1);

      const cssScale = targetWidth / unscaledViewport.width;
      const cssViewport = page.getViewport({ scale: cssScale });

      const outputScale = getOutputScale();

      const pageContainer = document.createElement("section");
      pageContainer.className = "page";
      pageContainer.setAttribute("data-page", String(pageNumber));

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d", {
        alpha: false
      });

      canvas.width = Math.ceil(cssViewport.width * outputScale);
      canvas.height = Math.ceil(cssViewport.height * outputScale);

      canvas.style.width = `${Math.ceil(cssViewport.width)}px`;
      canvas.style.height = `${Math.ceil(cssViewport.height)}px`;

      pageContainer.style.height = `${Math.ceil(cssViewport.height)}px`;
      pageContainer.appendChild(canvas);
      viewer.appendChild(pageContainer);

      const transform =
        outputScale !== 1
          ? [outputScale, 0, 0, outputScale, 0, 0]
          : null;

      await page.render({
        canvasContext: context,
        viewport: cssViewport,
        transform,
        background: "rgb(255,255,255)"
      }).promise;

      pageContainer.style.height = "auto";
    }

    async function renderDocument() {
      if (!pdfDocument) return;

      const generation = ++renderGeneration;
      viewer.innerHTML = "";

      for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
        await renderPage(pageNumber, generation);
        if (generation !== renderGeneration) return;
      }
    }

    async function init() {
      if (!file) {
        showError("Nenhum PDF informado. Use ?file=CAMINHO_DO_ARQUIVO.pdf");
        return;
      }

      try {
        const loadingTask = pdfjsLib.getDocument({
          url: file,
          useSystemFonts: true
        });

        pdfDocument = await loadingTask.promise;
        status.hidden = true;
        await renderDocument();
      } catch (error) {
        console.error(error);
        showError(
          "Não foi possível carregar o PDF. Confira o caminho do arquivo e se ele está acessível publicamente."
        );
      }
    }

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (pdfDocument) renderDocument();
      }, 250);
    });

    init();
  </script>
</body>
</html>
